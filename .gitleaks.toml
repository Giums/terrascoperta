[extend]
useDefault = true

[[rules]]
id = "copernicus-client-secret"
description = "Copernicus OAuth client secret"
# Gitleaks usa RE2 (Go), che non supporta i lookahead: non si può escludere
# `process.env.X` con `(?!...)`. Soluzione senza lookahead: niente punto `.`
# nel charset del valore. Un vero secret (base64url-style) non contiene punti,
# mentre `process.env.SENTINEL_CLIENT_SECRET` si ferma a "process" (7 char,
# sotto la soglia di 20) e quindi non matcha più — niente autosegnalazione su
# api/sentinel-token.ts, che legge il secret da process.env ma non lo contiene.
regex = '''(?i)(client.?secret|SENTINEL.*SECRET)\s*[=:]\s*['\"]?[a-zA-Z0-9\-_]{20,}['\"]?'''
tags = ["secret", "copernicus"]

[[rules]]
id = "generic-api-key"
description = "Generic API key pattern"
regex = '''(?i)(api[_-]?key|apikey|access[_-]?token)\s*[=:]\s*['\"]?[a-zA-Z0-9\-_]{16,}['\"]?'''
tags = ["secret", "api"]

[allowlist]
paths = [
  '''.env.example''',
  '''README.md''',
  '''PROGETTO-UHI-ITALIA.md'''
]
