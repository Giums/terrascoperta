name: Refresh sea temperature history

# Una volta l'anno, a ottobre: l'estate è finita da un pezzo e il prodotto
# riprocessato di Copernicus (indietro di circa un mese) ha ormai pubblicato
# anche agosto, quindi la stagione appena passata entra completa.
# workflow_dispatch per poterlo lanciare a mano senza aspettare ottobre.
on:
  schedule:
    - cron: "0 4 1 10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Rigenera la serie storica
        run: npm run sst:refresh

      # Se Copernicus non ha aggiunto nulla di nuovo il file è identico e non
      # c'è niente da committare: uscire qui evita un commit vuoto e un deploy
      # inutile in produzione.
      - name: C'è qualcosa di nuovo?
        id: diff
        run: |
          if git diff --quiet -- src/data/sst-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna estate nuova, niente da fare."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data/sst-history.json
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sst-history.json
          git commit -m "Aggiorna serie storica temperatura del mare (rigenerata da Copernicus Marine)"
          git push

      # Un push fatto con GITHUB_TOKEN non fa scattare deploy.yml (GitHub lo
      # impedisce per evitare loop di workflow), quindi il deploy va lanciato
      # da qui — stessa chiave a forced command usata da deploy.yml.
      - name: Deploy
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[${{ secrets.DEPLOY_HOST }}]:${{ secrets.DEPLOY_PORT }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID92Y8yJ/8Yu7+NEyaigOMMpjE36YeD9h/bzXx/1jSCy" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "deploy"
